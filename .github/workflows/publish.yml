name: Publish

# A `vX.Y.Z` tag builds both binaries and stages the three npm packages through trusted
# publishing (OIDC, no token). Nothing goes live until the maintainer approves each staged
# version on npmjs.com with 2FA (ADR 0006).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/version.js --check "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  windows:
    needs: [ci, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-x64
          path: target/release/nx-azure-cache.exe
          if-no-files-found: error

  linux:
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Static musl build in Docker, then `version` run in two bare images.
      - run: node scripts/build-linux.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: dist/nx-azure-cache-linux-x64
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15.0 or later.
      - run: npm install -g npm@11.21.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win32-x64
          path: npm/win32-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64
          path: dist
      - run: |
          mv dist/nx-azure-cache-linux-x64 npm/linux-x64/nx-azure-cache
          chmod +x npm/linux-x64/nx-azure-cache
          for d in npm/*/; do cp LICENSE "$d"; done
          cp README.md npm/nx-azure-cache/
      # Platform packages first: the main package depends on them.
      - run: npm stage publish --access public
        working-directory: npm/win32-x64
      - run: npm stage publish --access public
        working-directory: npm/linux-x64
      - run: npm stage publish
        working-directory: npm/nx-azure-cache
